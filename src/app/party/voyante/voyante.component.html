<div class="night-container">
  <h1 class="day-title">NUIT 1</h1>

  <div class="flip-card" [class.flipped]="isFlipped" (click)="flipCard()">
    <div class="flip-inner">
      <div class="flip-front">
        <img src="/assets/point-dinterrogation.png" alt="Interrogation">
      </div>
      <div class="flip-back">
        <img src="/assets/voyante.png" alt="Villageois">
        <p class="desc">Vous etes Voyante<br>
          Vous devez gagner avec le Village<br>
          Vous Pouvez voir le rôle d'un joueur</p>
      </div>
    </div>
  </div>

  <div class="players-container">
    <div
      class="player-option"
      *ngFor="let joueur of joueurs"
      [class.revealed]="joueur === joueurChoisi"
      [class.disabled]="joueurChoisi && joueur !== joueurChoisi"
      (click)="revealRole(joueur)"
    >
      {{ joueur.pseudo }} <span *ngIf="joueur === joueurChoisi">: {{ joueur.role }}</span>
    </div>
  </div>

  <button class="next-btn" (click)="goToNext()">button next</button>
  <div class="info-icon">?</div>
</div>
