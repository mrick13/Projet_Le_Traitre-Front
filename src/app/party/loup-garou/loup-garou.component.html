<div class="night-container">
  <h1 class="day-title">NUIT 1</h1>

  <div class="card-wrapper">
    <!-- Carte principale Loup-Garou -->
    <div class="flip-card" [class.flipped]="isFlipped" (click)="flipCard()">
      <div class="flip-inner">
        <div class="flip-front">
          <img src="/assets/point-dinterrogation.png" alt="Interrogation">
        </div>
        <div class="flip-back">
          <img src="/assets/loup-garou.png" alt="Loup-Garou">
          <p class="desc">
            Vous êtes Loup-Garou<br>
            Vous devez gagner avec les Loups<br>
            Vous pouvez tuer un joueur
          </p>
        </div>
      </div>
    </div>

    <!-- Carte Pouvoirs -->
    <div class="flip-card" [class.flipped]="isPowerFlipped" [class.power-validated]="powerValidated" (click)="flipPowerCard()">
      <div class="flip-inner">
        <div class="flip-front">
          <img src="/assets/point-dinterrogation.png" alt="Interrogation">
        </div>
        <div class="flip-back power-card">
          <p class="desc">Choisissez un joueur à éliminer :</p>
          <div class="players-container">
            <div
              class="player-option"
              *ngFor="let joueur of joueurs"
              [class.grisé]="joueur.id === 4 || joueur.etat === false"
              [class.revealed]="joueur === joueurCible"
              [class.disabled]="powerValidated || joueur.id === 4 || joueur.etat === false"
              (click)="choisirVictime(joueur)"
            >
              {{ joueur.pseudo }} <span *ngIf="joueur === joueurCible">: ciblé</span>
              <span *ngIf="joueur.etat === false"> (mort)</span>
            </div>
          </div>
          <button
            class="valider-btn"
            [disabled]="!joueurCible || powerValidated"
            (click)="validerChoix()"
          >
            Valider
          </button>
        </div>
      </div>
    </div>
  </div>

  <button class="next-btn" (click)="goToNext()">button next</button>
  <div class="info-icon">?</div>
</div>
