<div class="home-container">
  <button class="profile-link" (click)="goProfile()">Profil</button>

  <div class="overlay">
    <h1 class="title">Le Traître</h1>

    <div class="panel">
      <div class="welcome-text">Bonjour, <span class="pseudo">{{getUserPseudo()}}</span></div>
      <div class="button-container">
        <button class="btn primary" (click)="createGame()">Créer une partie</button>
        <button class="btn secondary" (click)="joinGame()">Rejoindre une partie</button>
      </div>
    </div>
  </div>
</div>
