<div class="profile-container">
  <button class="logout-link" (click)="deconnexion()">Se déconnecter</button>

  <div class="overlay">
    <h1 class="title">Mon profil</h1>

    <div class="card">
      <div class="pseudo-row" *ngIf="!modeEdition">
        <span class="pseudo-label">Pseudo : <b>{{ pseudo }}</b></span>
        <button class="icon-btn" (click)="commencerEdition()" title="Modifier le pseudo" aria-label="Modifier le pseudo">✎</button>
      </div>
      <div class="pseudo-row" *ngIf="modeEdition">
        <input class="pseudo-input" [(ngModel)]="nouveauPseudo" maxlength="30" [disabled]="enCours" />
        <button class="btn small primary" [disabled]="enCours" (click)="enregistrerPseudo()">Enregistrer</button>
        <button class="btn small ghost" [disabled]="enCours" (click)="annulerEdition()">Annuler</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Historique des parties</div>
      <div class="stats" *ngIf="!chargementHistorique">
        {{ nombreParties }} partie(s) jouée(s) &middot; {{ nombreVictoires }} victoire(s)
      </div>

      <div *ngIf="chargementHistorique" class="empty-msg">Chargement...</div>
      <div *ngIf="!chargementHistorique && historique.length === 0" class="empty-msg">
        Aucune partie terminée pour l'instant.
      </div>

      <div class="historique-list" *ngIf="!chargementHistorique && historique.length > 0">
        <div class="historique-item" *ngFor="let h of historique" [class.victoire]="h.won === true" [class.defaite]="h.won === false">
          <span class="date">{{ h.date | date:'dd/MM/yyyy HH:mm' }}</span>
          <span class="role">{{ h.role || '?' }}</span>
          <span class="resultat">{{ getWinnerLabel(h) }}</span>
        </div>
      </div>
    </div>

    <div class="button-row">
      <button class="btn primary" (click)="retourAccueil()">Retour à l'accueil</button>
    </div>
  </div>
</div>
