<div class="registration-container">
  <h1 class="title">Le Traître</h1>
  <form (ngSubmit)="onSubmit(registrationForm)" #registrationForm="ngForm">
    <label for="pseudo">Pseudo :</label>
    <input
      type="text"
      id="pseudo"
      name="pseudo"
      ngModel
      required
      class="input-field"
    />

    <label for="email">E-mail:</label>
    <input
      type="email"
      id="email"
      name="email"
      ngModel
      required
      class="input-field"
    />

    <label for="password">Mot de Passe :</label>
    <input
      type="password"
      id="password"
      name="password"
      ngModel
      required
      class="input-field"
    />

    <label for="confirmPassword">Confirmation Mot de Passe :</label>
    <input
      type="password"
      id="confirmPassword"
      name="confirmPassword"
      ngModel
      required
      class="input-field"
    />

    <label for="toLogin">
      Si vous avez déjà un compte cliquez <a routerLink="/login">ici</a>
    </label>

    <button
      type="submit"
      [disabled]="!registrationForm.valid"
      class="submit-button"
    >
      S’inscrire
    </button>
  </form>
</div>
